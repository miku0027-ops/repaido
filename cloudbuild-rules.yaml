# Generated by scripts/generate-selective-builds.py from cloudbuild.yaml.
# Manual release only; keep _RELEASE_APPROVED false on triggers.
steps:
  - id: require-explicit-release
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: python3
    args: ['scripts/check-release-authorization.py', '--approved=${_RELEASE_APPROVED}', '--commit=$COMMIT_SHA']
  - id: check-build-history-access
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: python3
    args: ['scripts/deploy-work-services.py', 'check-build-access', '--project=$PROJECT_ID', '--build=$BUILD_ID', '--build-region=$LOCATION']
  - id: check-firestore-rules-access
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: python3
    args: ['scripts/deploy-firestore-rules.py', '--project=$PROJECT_ID', '--check-access']
  - id: firestore-rules-tests
    name: node:24-trixie-slim
    entrypoint: bash
    args:
      - -ceu
      - |
        apt-get update
        apt-get install --yes --no-install-recommends openjdk-21-jre-headless
        npm install --global firebase-tools@15.32.1
        firebase emulators:exec --project=demo-repaido-security --only=firestore --config=firebase.security-tests.json 'node scripts/test-firestore-security.mjs'
  - id: await-release-turn
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: python3
    args: ['scripts/deploy-work-services.py', 'await-release', '--project=$PROJECT_ID', '--build=$BUILD_ID', '--build-region=$LOCATION']
  - id: deploy-firestore-rules
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: python3
    args: ['scripts/deploy-firestore-rules.py', '--project=$PROJECT_ID']

substitutions:
  # Set only for a batch the user explicitly asks to release, never on a trigger.
  _RELEASE_APPROVED: 'false'
  _REGION: us-central1
  _SERVICE: repaido-api
  # Confirm this Artifact Registry repository exists before submission.
  _IMAGE: us-central1-docker.pkg.dev/repaido/cloud-run-source-deploy/repaido-api
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
